<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gasparzinho | Gestão de Abastecimento</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24 selection:bg-teal-500 selection:text-black">

  <!-- Topbar -->
  <header class="sticky top-0 z-40 bg-slate-950/80 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="h-9 w-9 rounded-xl bg-teal-500/10 border border-teal-500/30 flex items-center justify-center text-teal-400 font-bold">
        ⛽
      </div>
      <div>
        <h1 class="text-base font-bold text-white tracking-tight leading-tight">Gasparzinho</h1>
        <p class="text-[11px] text-slate-400 font-medium">Ford Ka • 1.0 Flex</p>
      </div>
    </div>
    <button id="btnSync" onclick="carregarDados()" class="p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-teal-400 active:scale-95 transition">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
    </button>
  </header>

  <main class="max-w-md mx-auto p-4">

    <!-- ABA 1: FORMULÁRIO (NOVO / EDITAR) -->
    <section id="aba-novo" class="space-y-4">
      <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-5 shadow-xl">
        <div class="flex items-center justify-between mb-4">
          <h2 id="formTitulo" class="text-sm font-semibold uppercase tracking-wider text-teal-400">Novo Abastecimento</h2>
          <button type="button" id="btnCancelarEdicao" onclick="cancelarEdicao()" class="hidden text-xs text-rose-400 hover:underline">Cancelar Edição</button>
        </div>
        
        <form id="formAbastecimento" class="space-y-3.5">
          <input type="hidden" id="editRowIndex" value="">
          <input type="hidden" id="editDataHora" value="">

          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Odômetro Atual (km)</label>
            <input type="number" id="odometro" required placeholder="Ex: 167553"
              class="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-teal-400 text-sm transition">
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Combustível</label>
            <select id="combustivel" class="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-teal-400 text-sm transition">
              <option value="Gas. Aditivada" selected>Gasolina Aditivada</option>
              <option value="Gas. Comum">Gasolina Comum</option>
              <option value="Etanol">Etanol</option>
            </select>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Preço / Litro (R$)</label>
              <input type="text" inputmode="decimal" id="precoLitro" required placeholder="6,29"
                class="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-teal-400 text-sm transition">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Litros (L)</label>
              <input type="text" inputmode="decimal" id="litros" required placeholder="35,187"
                class="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-teal-400 text-sm transition">
            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Valor Total (R$)</label>
            <input type="text" inputmode="decimal" id="valorTotal" required placeholder="221,33"
              class="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-teal-400 font-semibold focus:outline-none focus:border-teal-400 text-sm transition">
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Posto / Bandeira</label>
            <input type="text" id="posto" placeholder="Ex: Shell, Posto 202"
              class="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-teal-400 text-sm transition">
          </div>

          <div class="flex items-center justify-between p-3 bg-slate-950 border border-slate-800 rounded-xl">
            <span class="text-xs font-medium text-slate-300">Completou o tanque?</span>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="tanqueCheio" checked class="sr-only peer">
              <div class="w-10 h-5 bg-slate-800 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-teal-500"></div>
            </label>
          </div>

          <button type="submit" id="btnSalvar"
            class="w-full mt-2 bg-gradient-to-r from-teal-500 to-emerald-500 hover:from-teal-600 hover:to-emerald-600 text-slate-950 font-bold py-3.5 rounded-xl shadow-lg shadow-teal-500/20 active:scale-[0.98] transition">
            Salvar no Google Drive
          </button>
          
          <div id="statusMsg" class="hidden text-center text-xs py-2 rounded-lg font-medium"></div>
        </form>
      </div>
    </section>

    <!-- ABA 2: HISTÓRICO COM EDIÇÃO E EXCLUSÃO -->
    <section id="aba-historico" class="hidden space-y-3">
      <div class="flex items-center justify-between mb-1">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Últimos Abastecimentos</h2>
        <span id="badgeTotalRegistros" class="text-xs text-teal-400 font-semibold">0 registros</span>
      </div>
      <div id="listaHistorico" class="space-y-2.5"></div>
    </section>

    <!-- ABA 3: DASHBOARD -->
    <section id="aba-dashboard" class="hidden space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
          <span class="text-[11px] font-medium text-slate-400 block uppercase">Total Investido</span>
          <span id="dashTotalPago" class="text-lg font-bold text-white tracking-tight mt-1 block">R$ 0,00</span>
          <span id="dashTotalLitros" class="text-[11px] text-slate-500 block mt-0.5">0 L</span>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
          <span class="text-[11px] font-medium text-slate-400 block uppercase">Média Geral</span>
          <span id="dashMediaConsumo" class="text-lg font-bold text-teal-400 tracking-tight mt-1 block">0,00 km/L</span>
          <span id="dashPrecoMedio" class="text-[11px] text-slate-500 block mt-0.5">R$ 0,00 / L</span>
        </div>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3">Evolução do Consumo (km/L)</h3>
        <div class="h-44 w-full">
          <canvas id="chartConsumo"></canvas>
        </div>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3">Divisão por Combustível</h3>
        <div class="h-44 w-full flex justify-center">
          <canvas id="chartCombustivel"></canvas>
        </div>
      </div>
    </section>

  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 inset-x-0 bg-slate-950/95 backdrop-blur-lg border-t border-slate-800 max-w-md mx-auto z-50">
    <div class="grid grid-cols-3 py-2">
      <button onclick="trocarAba('novo')" id="tab-novo" class="flex flex-col items-center gap-1 text-teal-400">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        <span id="lblTabNovo" class="text-[10px] font-semibold">Novo</span>
      </button>
      <button onclick="trocarAba('historico')" id="tab-historico" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
        <span class="text-[10px] font-medium">Histórico</span>
      </button>
      <button onclick="trocarAba('dashboard')" id="tab-dashboard" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
        <span class="text-[10px] font-medium">Dashboard</span>
      </button>
    </div>
  </nav>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4Ims7hwmR2QOpB75Y6_QxZBfgXJorPV_SZwhJKswAu6iqMsQTEaMdsTcQtIFuNquA/exec";

    let dadosCache = [];
    let chartConsumoInstance = null;
    let chartCombustivelInstance = null;

    function trocarAba(aba) {
      ['novo', 'historico', 'dashboard'].forEach(t => {
        document.getElementById(`aba-${t}`).classList.add('hidden');
        const tabBtn = document.getElementById(`tab-${t}`);
        if (tabBtn) {
          tabBtn.classList.remove('text-teal-400');
          tabBtn.classList.add('text-slate-400');
        }
      });

      const abaAtiva = document.getElementById(`aba-${aba}`);
      if (abaAtiva) abaAtiva.classList.remove('hidden');

      const activeTabBtn = document.getElementById(`tab-${aba}`);
      if (activeTabBtn) {
        activeTabBtn.classList.remove('text-slate-400');
        activeTabBtn.classList.add('text-teal-400');
      }

      if (aba === 'dashboard') {
        setTimeout(() => renderizarDashboard(), 50);
      }
    }

    const precoInput = document.getElementById('precoLitro');
    const litrosInput = document.getElementById('litros');
    const totalInput = document.getElementById('valorTotal');

    function calcularTotal() {
      const p = parseFloat(precoInput.value.replace(',', '.'));
      const l = parseFloat(litrosInput.value.replace(',', '.'));
      if (!isNaN(p) && !isNaN(l)) {
        totalInput.value = (p * l).toFixed(2).replace('.', ',');
      }
    }
    precoInput.addEventListener('input', calcularTotal);
    litrosInput.addEventListener('input', calcularTotal);

    // Preparar edição de item
    function editarItem(rowIndex) {
      const item = dadosCache.find(x => x.rowIndex === rowIndex);
      if (!item) return;

      document.getElementById('editRowIndex').value = item.rowIndex;
      document.getElementById('editDataHora').value = item.Data || '';
      document.getElementById('odometro').value = item.Odometro || '';
      document.getElementById('combustivel').value = item.Combustivel || 'Gas. Aditivada';
      document.getElementById('precoLitro').value = String(item.Preco_Litro || '').replace('.', ',');
      document.getElementById('litros').value = String(item.Litros || '').replace('.', ',');
      document.getElementById('valorTotal').value = String(item.Valor_Total || '').replace('.', ',');
      document.getElementById('posto').value = item.Posto || '';
      document.getElementById('tanqueCheio').checked = String(item.Tanque_Cheio).trim().toLowerCase() === 'sim';

      document.getElementById('formTitulo').innerText = "Editar Abastecimento";
      document.getElementById('btnSalvar').innerText = "Atualizar Registro";
      document.getElementById('btnCancelarEdicao').classList.remove('hidden');
      document.getElementById('lblTabNovo').innerText = "Editar";

      trocarAba('novo');
    }

    function cancelarEdicao() {
      document.getElementById('formAbastecimento').reset();
      document.getElementById('editRowIndex').value = '';
      document.getElementById('editDataHora').value = '';
      document.getElementById('tanqueCheio').checked = true;
      document.getElementById('formTitulo').innerText = "Novo Abastecimento";
      document.getElementById('btnSalvar').innerText = "Salvar no Google Drive";
      document.getElementById('btnCancelarEdicao').classList.add('hidden');
      document.getElementById('lblTabNovo').innerText = "Novo";
    }

    // Exclusão de item
    async function excluirItem(rowIndex) {
      if (!confirm("Deseja realmente excluir este abastecimento da base?")) return;
      try {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ acao: 'excluir', rowIndex: rowIndex })
        });
        setTimeout(() => carregarDados(), 1500);
      } catch (err) {
        alert("Erro ao excluir registro.");
      }
    }

    // Envio (Novo ou Edição)
    document.getElementById('formAbastecimento').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSalvar');
      const status = document.getElementById('statusMsg');
      const rowIndex = document.getElementById('editRowIndex').value;
      const isEditing = Boolean(rowIndex);

      btn.disabled = true;
      btn.innerText = "Gravando na nuvem...";

      const payload = {
        acao: isEditing ? 'editar' : 'salvar',
        rowIndex: rowIndex,
        dataHora: document.getElementById('editDataHora').value,
        odometro: document.getElementById('odometro').value,
        combustivel: document.getElementById('combustivel').value,
        precoLitro: precoInput.value,
        litros: litrosInput.value,
        valorTotal: totalInput.value,
        tanqueCheio: document.getElementById('tanqueCheio').checked,
        posto: document.getElementById('posto').value
      };

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        status.innerText = isEditing ? "Registro atualizado com sucesso!" : "Abastecimento salvo com sucesso!";
        status.className = "text-center text-xs py-2 rounded-lg font-medium text-emerald-400 bg-emerald-950/40 border border-emerald-800 block";
        cancelarEdicao();
        setTimeout(() => carregarDados(), 1500);
      } catch (err) {
        status.innerText = "Erro ao processar registro.";
        status.className = "text-center text-xs py-2 rounded-lg font-medium text-red-400 bg-red-950/40 border border-red-800 block";
      } finally {
        btn.disabled = false;
        btn.innerText = "Salvar no Google Drive";
      }
    });

    // Leitura dos dados
    async function carregarDados() {
      if (!APPS_SCRIPT_URL) return;
      try {
        const res = await fetch(APPS_SCRIPT_URL, { redirect: 'follow' });
        const json = await res.json();
        if (json.status === 'success' && Array.isArray(json.data)) {
          dadosCache = json.data;
          renderizarHistorico();
          renderizarDashboard();
        }
      } catch (err) {
        console.error("Erro ao sincronizar:", err);
      }
    }

    // Renderiza lista com botões de ação
    function renderizarHistorico() {
      const container = document.getElementById('listaHistorico');
      const badge = document.getElementById('badgeTotalRegistros');
      if (badge) badge.innerText = `${dadosCache.length} registros`;
      if (!container) return;
      container.innerHTML = '';

      const listaInvertida = [...dadosCache].reverse();
      listaInvertida.forEach(item => {
        const dataFmt = item.Data ? String(item.Data).split(' ')[0] : '-';
        const odoFmt = item.Odometro ? Number(item.Odometro).toLocaleString('pt-BR') : '-';
        const valorFmt = item.Valor_Total ? Number(item.Valor_Total).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) : '-';
        const consumoFmt = item.Consumo_KmL ? `${Number(item.Consumo_KmL).toFixed(2)} km/L` : '';

        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800/90 rounded-xl p-3.5 flex items-center justify-between";
        card.innerHTML = `
          <div class="flex-1 pr-2">
            <div class="flex items-center gap-2">
              <span class="text-xs font-semibold text-white">${item.Combustivel || 'Gasolina'}</span>
              ${consumoFmt ? `<span class="bg-teal-500/10 border border-teal-500/30 text-teal-400 text-[10px] font-bold px-1.5 py-0.5 rounded">${consumoFmt}</span>` : ''}
            </div>
            <p class="text-[11px] text-slate-400 mt-1">${odoFmt} km • ${item.Litros} L ${item.Posto ? `• ${item.Posto}` : ''}</p>
            <span class="text-[10px] text-slate-500">${dataFmt}</span>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-sm font-bold text-white">${valorFmt}</span>
            <div class="flex items-center gap-1">
              <button onclick="editarItem(${item.rowIndex})" title="Editar" class="p-1.5 rounded-lg bg-slate-800 text-slate-300 hover:text-teal-400 active:scale-95 transition">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
              </button>
              <button onclick="excluirItem(${item.rowIndex})" title="Excluir" class="p-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-rose-400 active:scale-95 transition">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
              </button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderizarDashboard() {
      if (!dadosCache || dadosCache.length === 0) return;

      let totalPago = 0;
      let totalLitros = 0;
      let consumos = [];
      let labels = [];
      let splitCombustivel = { 'Gas. Comum': 0, 'Gas. Aditivada': 0, 'Etanol': 0 };

      dadosCache.forEach(item => {
        const v = parseFloat(String(item.Valor_Total).replace(',', '.')) || 0;
        const l = parseFloat(String(item.Litros).replace(',', '.')) || 0;
        totalPago += v;
        totalLitros += l;

        const comb = item.Combustivel ? item.Combustivel.trim() : '';
        if (splitCombustivel.hasOwnProperty(comb)) splitCombustivel[comb] += v;
        else if (comb) splitCombustivel[comb] = v;

        const c = parseFloat(String(item.Consumo_KmL).replace(',', '.'));
        if (!isNaN(c) && c > 0) {
          consumos.push(c);
          labels.push(String(item.Data).split(' ')[0]);
        }
      });

      const mediaConsumo = consumos.length > 0 ? (consumos.reduce((a, b) => a + b, 0) / consumos.length) : 0;
      const precoMedioLitro = totalLitros > 0 ? (totalPago / totalLitros) : 0;

      const elTotalPago = document.getElementById('dashTotalPago');
      const elTotalLitros = document.getElementById('dashTotalLitros');
      const elMediaConsumo = document.getElementById('dashMediaConsumo');
      const elPrecoMedio = document.getElementById('dashPrecoMedio');

      if (elTotalPago) elTotalPago.innerText = totalPago.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      if (elTotalLitros) elTotalLitros.innerText = `${totalLitros.toFixed(1)} L abastecidos`;
      if (elMediaConsumo) elMediaConsumo.innerText = `${mediaConsumo.toFixed(2)} km/L`;
      if (elPrecoMedio) elPrecoMedio.innerText = `${precoMedioLitro.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })} / L médio`;

      const canvasConsumo = document.getElementById('chartConsumo');
      if (canvasConsumo) {
        const ctxConsumo = canvasConsumo.getContext('2d');
        if (chartConsumoInstance) chartConsumoInstance.destroy();
        chartConsumoInstance = new Chart(ctxConsumo, {
          type: 'line',
          data: {
            labels: labels.slice(-15),
            datasets: [{
              data: consumos.slice(-15),
              borderColor: '#14b8a6',
              backgroundColor: 'rgba(20, 184, 166, 0.1)',
              fill: true,
              tension: 0.3,
              pointRadius: 3
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { ticks: { color: '#64748b', font: { size: 9 } }, grid: { display: false } },
              y: { ticks: { color: '#64748b', font: { size: 9 } }, grid: { color: '#1e293b' } }
            }
          }
        });
      }

      const canvasComb = document.getElementById('chartCombustivel');
      if (canvasComb) {
        const ctxComb = canvasComb.getContext('2d');
        if (chartCombustivelInstance) chartCombustivelInstance.destroy();
        chartCombustivelInstance = new Chart(ctxComb, {
          type: 'doughnut',
          data: {
            labels: Object.keys(splitCombustivel),
            datasets: [{
              data: Object.values(splitCombustivel),
              backgroundColor: ['#0284c7', '#14b8a6', '#f59e0b', '#8b5cf6'],
              borderWidth: 0
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'bottom', labels: { color: '#94a3b8', boxWidth: 10, font: { size: 10 } } }
            }
          }
        });
      }
    }

    window.addEventListener('DOMContentLoaded', carregarDados);
  </script>
</body>
</html>
