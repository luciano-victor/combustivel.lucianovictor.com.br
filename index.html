<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gasparzinho - Abastecimento</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 flex justify-center items-start">

  <main class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl mt-4">
    <!-- Cabeçalho -->
    <header class="flex items-center justify-between pb-5 border-b border-slate-800">
      <div>
        <span class="text-xs font-semibold tracking-wider text-teal-400 uppercase">Veículo</span>
        <h1 class="text-xl font-bold text-white">Gasparzinho <span class="text-xs text-slate-400 font-normal">(Ford Ka)</span></h1>
      </div>
      <div class="h-10 w-10 rounded-full bg-teal-500/10 border border-teal-500/30 flex items-center justify-center text-teal-400">
        ⛽
      </div>
    </header>

    <!-- Formulário -->
    <form id="fuelForm" class="mt-5 space-y-4">
      
      <!-- Odômetro -->
      <div>
        <label for="odometro" class="block text-xs font-medium text-slate-400 mb-1">Odômetro Atual (km)</label>
        <input type="number" id="odometro" required placeholder="Ex: 167553"
          class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-teal-400 transition">
      </div>

      <!-- Tipo de Combustível -->
      <div>
        <label for="combustivel" class="block text-xs font-medium text-slate-400 mb-1">Combustível</label>
        <select id="combustivel" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-teal-400 transition">
          <option value="Gas. Comum">Gasolina Comum</option>
          <option value="Gas. Aditivada" selected>Gasolina Aditivada</option>
          <option value="Etanol">Etanol</option>
        </select>
      </div>

      <!-- Grid: Preço por Litro e Litros -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="precoLitro" class="block text-xs font-medium text-slate-400 mb-1">Preço / Litro (R$)</label>
          <input type="text" inputmode="decimal" id="precoLitro" required placeholder="6,29"
            class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-teal-400 transition">
        </div>
        <div>
          <label for="litros" class="block text-xs font-medium text-slate-400 mb-1">Litros (L)</label>
          <input type="text" inputmode="decimal" id="litros" required placeholder="35,187"
            class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-teal-400 transition">
        </div>
      </div>

      <!-- Valor Total (Calculado ou Editável) -->
      <div>
        <label for="valorTotal" class="block text-xs font-medium text-slate-400 mb-1">Valor Total Pago (R$)</label>
        <input type="text" inputmode="decimal" id="valorTotal" required placeholder="221,33"
          class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-teal-400 font-semibold text-lg focus:outline-none focus:border-teal-400 transition">
      </div>

      <!-- Posto / Bandeira -->
      <div>
        <label for="posto" class="block text-xs font-medium text-slate-400 mb-1">Posto / Bandeira</label>
        <input type="text" id="posto" placeholder="Ex: Shell, Ipiranga"
          class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-teal-400 transition">
      </div>

      <!-- Toggle: Tanque Cheio -->
      <div class="flex items-center justify-between p-3 bg-slate-950 border border-slate-800 rounded-xl">
        <span class="text-sm font-medium text-slate-300">Completou o tanque?</span>
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" id="tanqueCheio" checked class="sr-only peer">
          <div class="w-11 h-6 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-teal-500"></div>
        </label>
      </div>

      <!-- Botão de Envio -->
      <button type="submit" id="btnSalvar"
        class="w-full mt-2 bg-gradient-to-r from-teal-500 to-emerald-500 hover:from-teal-600 hover:to-emerald-600 text-slate-950 font-bold py-4 rounded-xl shadow-lg shadow-teal-500/20 active:scale-[0.98] transition duration-150">
        Salvar Abastecimento
      </button>

      <div id="statusMsg" class="hidden text-center text-sm py-2 rounded-lg font-medium"></div>
    </form>
  </main>

  <script>
    // URL gerada na implantação do Google Apps Script
    const SCRIPT_URL = https://script.google.com/macros/s/AKfycby4Ims7hwmR2QOpB75Y6_QxZBfgXJorPV_SZwhJKswAu6iqMsQTEaMdsTcQtIFuNquA/exec;

    const precoInput = document.getElementById('precoLitro');
    const litrosInput = document.getElementById('litros');
    const totalInput = document.getElementById('valorTotal');
    const form = document.getElementById('fuelForm');
    const btnSalvar = document.getElementById('btnSalvar');
    const statusMsg = document.getElementById('statusMsg');

    // Auto-cálculo de total ao digitar preço e litros
    function calcularTotal() {
      const p = parseFloat(precoInput.value.replace(',', '.'));
      const l = parseFloat(litrosInput.value.replace(',', '.'));
      if (!isNaN(p) && !isNaN(l)) {
        totalInput.value = (p * l).toFixed(2).replace('.', ',');
      }
    }
    precoInput.addEventListener('input', calcularTotal);
    litrosInput.addEventListener('input', calcularTotal);

    // Envio para o Google Apps Script
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btnSalvar.disabled = true;
      btnSalvar.innerText = "Salvando na nuvem...";

      const payload = {
        odometro: document.getElementById('odometro').value,
        combustivel: document.getElementById('combustivel').value,
        precoLitro: precoInput.value,
        litros: litrosInput.value,
        valorTotal: totalInput.value,
        tanqueCheio: document.getElementById('tanqueCheio').checked,
        posto: document.getElementById('posto').value
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors', // Evita bloqueios de CORS do Google Apps Script
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        statusMsg.innerText = "Abastecimento salvo com sucesso no Drive!";
        statusMsg.className = "text-center text-sm py-2 rounded-lg font-medium text-emerald-400 bg-emerald-950/40 border border-emerald-800 block";
        form.reset();
        document.getElementById('tanqueCheio').checked = true;
      } catch (err) {
        statusMsg.innerText = "Erro ao registrar. Verifique a conexão.";
        statusMsg.className = "text-center text-sm py-2 rounded-lg font-medium text-red-400 bg-red-950/40 border border-red-800 block";
      } finally {
        btnSalvar.disabled = false;
        btnSalvar.innerText = "Salvar Abastecimento";
      }
    });
  </script>
</body>
</html>
